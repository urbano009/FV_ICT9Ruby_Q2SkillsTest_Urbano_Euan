    #bg::before {

        position: absolute;

        left: 0;

        overflow: hidden;
        background-color: #183361;
        position: fixed;
        bottom: 0;
        width: 100%;
        text-align: center;
        color: aliceblue;
    }
    #form-box {
        position: relative;
        z-index: 1;
        width: 1500px;
        height: auto;
        padding: 30px;
        border: 1px solid white;
        border-radius: 15px;
        background-color: rgba(255, 255, 255, 0.75);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    #fname{
        display: block;
        width: 100%;
        padding: 10px;

        margin-bottom: 15px;

    #lname{
        display: block;

        padding: 10px;
        margin-top: 5px;

    }

        display: block;
        width: 100%;
        padding: 10px;
        margin-top: 5px;

    #GL{
        display: block;

    #gender{
        display: block;

        margin-bottom: 15px;

        border-radius: 5px;
    }
    #mess{
        display: block;
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        border: 1px solid gray;
        border-radius: 5px;
    }
    #submit{
        position: relative;
        width: 150px;
        height: 70px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);

<header>

        <div id="bg">

    <div class="container d-flex justify-content-center">
        

        <div id="form-box">

            <h1 class="text-center mb-4">OBMC Enrollment Form</h1>
            
            <h2>Student Information</h2>

            <form>

            <div class="row">

                <div class="col-md-6">
  
                <label for="fname"> First Name</label>
                <input type="text" id="fname" name="fname" placeholder="Lebron">

                </div>

                <div class="col-md-6">
  
                <label for="lname"> Last Name</label>
                <input type="text" id="lname" name="lname" placeholder="James">

                </div>

            </div>

            <div class="row">

                <div class="col-md-4">
  
                <label for="date">Birth Date</label>
                <input type="date" id="date" name="date">

                </div>

                <div class="col-md-4">
  
                <label for="gender">Gender</label>
                <select id="gender" name="gender">
                    <option value="">Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                </div>

                <div class="col-md-4">
  
                <label for="GL">Grade Level</label>
                <select id="GL" name="GL">
                    <option value="">Select Grade</option>
                    <option value="Grade 1">Grade 1</option>
                    <option value="Grade 2">Grade 2</option>
                    <option value="Grade 3">Grade 3</option>
                    <option value="Grade 4">Grade 4</option>
                    <option value="Grade 5">Grade 5</option>
                    <option value="Grade 6">Grade 6</option>
                    <option value="Grade 7">Grade 7</option>
                    <option value="Grade 8">Grade 8</option>
                    <option value="Grade 9">Grade 9</option>
                    <option value="Grade 10">Grade 10</option>
                    <option value="Grade 11">Grade 11</option>
                    <option value="Grade 12">Grade 12</option>
                </select>

                </div>

            </div>


            <div>
            
            <h2>Contact Details</h2>

                <label for="Email"> Email</label>
                <input type="email" id="Email" name="Email" placeholder="student@example.com">

                <label for="subj">Contact Number</label>
                <input type="text" id="subj" name="subj" placeholder="987-654-3210">


            </div>

            <div>

            <h2>Other Information</h2>

                <input type="checkbox" name="f2f">
                <label for="f2f">Face-to-Face</label>

                <br>

                <input type="checkbox" name="online">
                <label for="online">Online</label>

                <br><br>

                <input type="checkbox" name="confirm">
                <label for="confirm">I confirm that the information provided is true and legitimate</label>

            </div>

            <div class="container d-flex justify-content-center">

                <button id="submit" type="button" id="btn" class="btn btn-primary">Submit Form</button>

            </div>

            </form>

</header>


<footer class="footer" id="foot">
    <p> 2026 OBMC.</p>
    <p>Contact | About | Enroll</p>
</footer>
